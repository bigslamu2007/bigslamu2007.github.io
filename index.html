<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Life OS</title>
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black">
    <style>
        :root { 
            --primary: #0A84FF; --success: #32D74B; --bg: #000000; 
            --card: #1C1C1E; --text: #FFFFFF; --secondary-text: #8E8E93; --border: #38383A;
            --danger: #FF453A;
        }

        body { font-family: -apple-system, sans-serif; background: var(--bg); color: var(--text); margin: 0; padding: 0; height: 100vh; overflow: hidden; }

        .nav-bar { position: fixed; top: 0; width: 100%; display: flex; background: #161617; padding-top: env(safe-area-inset-top); z-index: 1000; }
        .nav-item { flex: 1; height: 50px; display: flex; align-items: center; justify-content: center; color: var(--secondary-text); font-size: 10px; font-weight: 600; text-transform: uppercase; border-right: 1px solid var(--border); transition: background 0.2s; }
        .nav-item:last-child { border-right: none; }
        .nav-item.active { color: var(--text); background: var(--card); box-shadow: inset 0 -3px 0 var(--primary); }

        .content-area { margin-top: calc(70px + env(safe-area-inset-top)); height: calc(100vh - 100px); overflow-y: auto; padding: 0 15px; padding-bottom: 80px; }
        .tab-content { display: none; animation: fadeIn 0.2s ease-out; }
        .tab-content.active { display: block; }

        .goal-card { background: var(--card); padding: 18px; border-radius: 14px; margin-bottom: 12px; border: 1px solid #2C2C2E; }
        .tracker-header { display: flex; justify-content: space-between; margin-bottom: 10px; font-weight: bold; font-size: 15px; align-items: center; }
        
        .weekly-grid { display: flex; gap: 8px; margin-top: 10px; }
        .session-btn { flex: 1; background: #2C2C2E; border: 1px solid var(--border); color: var(--secondary-text); padding: 12px; border-radius: 10px; font-size: 11px; text-align: center; font-weight: 600; }
        .session-btn.done { background: var(--success); color: white; border-color: var(--success); }

        .weight-input-group { display: flex; align-items: center; gap: 8px; margin-top: 10px; padding-top: 10px; border-top: 1px solid var(--border); }
        .weight-label { font-size: 12px; color: var(--secondary-text); }
        .weight-input { background: #2C2C2E; border: 1px solid var(--border); border-radius: 6px; color: white; padding: 6px; width: 70px; text-align: center; font-size: 14px; }

        .progress-container { display: flex; align-items: center; gap: 12px; }
        .count-display { font-family: monospace; font-size: 16px; color: var(--primary); min-width: 65px; }
        .progress-bar-bg { flex-grow: 1; height: 6px; background: #3A3A3C; border-radius: 3px; overflow: hidden; }
        .progress-bar-fill { height: 100%; background: var(--primary); width: 0%; transition: width 0.4s ease; }
        
        .input-group { margin-top: 12px; display: flex; gap: 8px; }
        input[type="number"] { background: #2C2C2E; border: none; border-radius: 8px; color: white; padding: 8px; width: 50px; text-align: center; font-size: 16px; }
        button { background: var(--primary); color: white; border: none; border-radius: 8px; padding: 8px 12px; font-weight: 600; flex-grow: 1; font-size: 14px; }
        
        .complete-status { color: var(--success); font-size: 11px; display: none; }
        .stat-line { display: flex; justify-content: space-between; padding: 8px 0; border-bottom: 0.5px solid var(--border); }
        .full-reset-btn { background: var(--danger); margin-top: 30px; width: 100%; padding: 15px; border-radius: 12px; font-weight: bold; color: white; border: none; }

        @keyframes fadeIn { from { opacity: 0; } to { opacity: 1; } }
    </style>
</head>
<body>

    <nav class="nav-bar">
        <div class="nav-item active" onclick="showTab('daily', this)">Daily</div>
        <div class="nav-item" onclick="showTab('weekly', this)">Weekly</div>
        <div class="nav-item" onclick="showTab('monthly', this)">Monthly</div>
        <div class="nav-item" onclick="showTab('yearly', this)">Yearly</div>
        <div class="nav-item" onclick="showTab('stats', this)">Stats</div>
    </nav>

    <div class="content-area">
        <div id="daily" class="tab-content active">
            <div class="goal-card" id="card-pushups" data-goal="50"><div class="tracker-header"><span>Push-Ups</span><span class="complete-status">COMPLETE ✓</span></div><div class="progress-container"><div class="count-display">0/50</div><div class="progress-bar-bg"><div class="progress-bar-fill"></div></div></div><div class="input-group"><input type="number" placeholder="+0" inputmode="numeric"><button onclick="addReps('pushups')">Add</button></div></div>
            <div class="goal-card" id="card-situps" data-goal="50"><div class="tracker-header"><span>Sit-Ups</span><span class="complete-status">COMPLETE ✓</span></div><div class="progress-container"><div class="count-display">0/50</div><div class="progress-bar-bg"><div class="progress-bar-fill"></div></div></div><div class="input-group"><input type="number" placeholder="+0" inputmode="numeric"><button onclick="addReps('situps')">Add</button></div></div>
            <div class="goal-card" id="card-squats" data-goal="50"><div class="tracker-header"><span>Squats</span><span class="complete-status">COMPLETE ✓</span></div><div class="progress-container"><div class="count-display">0/50</div><div class="progress-bar-bg"><div class="progress-bar-fill"></div></div></div><div class="input-group"><input type="number" placeholder="+0" inputmode="numeric"><button onclick="addReps('squats')">Add</button></div></div>
            <div class="goal-card" id="card-ammocan" data-goal="50"><div class="tracker-header"><span>Ammo Can Lifts</span><span class="complete-status">COMPLETE ✓</span></div><div class="progress-container"><div class="count-display">0/50</div><div class="progress-bar-bg"><div class="progress-bar-fill"></div></div></div><div class="input-group"><input type="number" placeholder="+0" inputmode="numeric"><button onclick="addReps('ammocan')">Add</button></div></div>
            <div class="goal-card" id="card-pullups" data-goal="20"><div class="tracker-header"><span>Pull-Ups</span><span class="complete-status">COMPLETE ✓</span></div><div class="progress-container"><div class="count-display">0/20</div><div class="progress-bar-bg"><div class="progress-bar-fill"></div></div></div><div class="input-group"><input type="number" placeholder="+0" inputmode="numeric"><button onclick="addReps('pullups')">Add</button></div></div>
            <div class="goal-card" id="card-run" data-goal="1"><div class="tracker-header"><span>Run 1 Mile</span><span class="complete-status">COMPLETE ✓</span></div><div class="progress-container"><div class="count-display">0/1</div><div class="progress-bar-bg"><div class="progress-bar-fill"></div></div></div><div class="input-group"><button onclick="addReps('run', 1)">+1 Mile Complete</button></div></div>
        </div>

        <div id="weekly" class="tab-content">
            <div class="goal-card">
                <div class="tracker-header">Daily Commission Complete</div>
                <div class="progress-container">
                    <div class="count-display" id="commission-count">0/5</div>
                    <div class="progress-bar-bg"><div id="commission-fill" class="progress-bar-fill" style="background: var(--success)"></div></div>
                </div>
            </div>
            <div id="weekly-exercises-container"></div>
        </div>

        <div id="stats" class="tab-content">
            <div class="goal-card">
                <h3 style="margin-top:0">All-Time Stats</h3>
                <div id="all-time-stats"></div>
            </div>
            <button class="full-reset-btn" onclick="dangerZoneReset()">HARD RESET ALL DATA</button>
        </div>

        <div id="monthly" class="tab-content"></div><div id="yearly" class="tab-content"></div>
    </div>

    <script>
        const exercises = ['pushups', 'situps', 'squats', 'ammocan', 'pullups', 'run'];
        const weeklyEx = [
            { id: 'bench', name: 'Bench Press' },
            { id: 'curls', name: 'Bicep Curls' },
            { id: 'goblet', name: 'Goblet Squats' },
            { id: 'farmers', name: 'Farmers Carry' },
            { id: 'skull', name: 'Skullcrushers' }
        ];

        function checkResets() {
            const now = new Date();
            const pstNow = new Date(now.toLocaleString("en-US", {timeZone: "America/Los_Angeles"}));
            
            // Daily Reset (8am PST)
            const lastDaily = localStorage.getItem('lastDailyReset');
            let dailyTarget = new Date(pstNow);
            dailyTarget.setHours(8, 0, 0, 0);
            if (pstNow < dailyTarget) dailyTarget.setDate(dailyTarget.getDate() - 1);

            if (!lastDaily || new Date(lastDaily) < dailyTarget) {
                if (localStorage.getItem('dailyComplete') === 'true') {
                    let comms = parseInt(localStorage.getItem('commissions')) || 0;
                    localStorage.setItem('commissions', Math.min(comms + 1, 5));
                }
                exercises.forEach(ex => localStorage.removeItem(ex));
                localStorage.setItem('dailyComplete', 'false');
                localStorage.setItem('lastDailyReset', pstNow.toISOString());
            }

            // Weekly Reset (Monday 8am PST)
            const lastWeekly = localStorage.getItem('lastWeeklyReset');
            let weeklyTarget = new Date(pstNow);
            let day = pstNow.getDay();
            let diff = (day < 1) ? -6 : 1 - day; 
            weeklyTarget.setDate(pstNow.getDate() + diff);
            weeklyTarget.setHours(8, 0, 0, 0);
            if (pstNow < weeklyTarget) weeklyTarget.setDate(weeklyTarget.getDate() - 7);

            if (!lastWeekly || new Date(lastWeekly) < weeklyTarget) {
                weeklyEx.forEach(ex => {
                    localStorage.removeItem(`w_${ex.id}_1`);
                    localStorage.removeItem(`w_${ex.id}_2`);
                });
                localStorage.setItem('commissions', 0);
                localStorage.setItem('lastWeeklyReset', pstNow.toISOString());
                // Note: weight_ keys are NOT removed here.
            }
        }

        function renderWeekly() {
            const container = document.getElementById('weekly-exercises-container');
            container.innerHTML = '';
            weeklyEx.forEach(ex => {
                const weight = localStorage.getItem(`weight_${ex.id}`) || '';
                container.insertAdjacentHTML('beforeend', `
                    <div class="goal-card">
                        <div class="tracker-header"><span>${ex.name} (2x)</span><span id="w-${ex.id}-c" class="complete-status">✓</span></div>
                        <div class="weekly-grid">
                            <button id="${ex.id}-1" class="session-btn" onclick="toggleWeekly('${ex.id}', 1)">Session 1</button>
                            <button id="${ex.id}-2" class="session-btn" onclick="toggleWeekly('${ex.id}', 2)">Session 2</button>
                        </div>
                        <div class="weight-input-group">
                            <span class="weight-label">Weight (lbs):</span>
                            <input type="number" class="weight-input" value="${weight}" 
                                   onchange="saveWeight('${ex.id}', this.value)" placeholder="---">
                        </div>
                    </div>`);
            });
        }

        function renderStats() {
            const container = document.getElementById('all-time-stats');
            container.innerHTML = '';
            exercises.forEach(ex => {
                const total = localStorage.getItem('total_' + ex) || 0;
                container.insertAdjacentHTML('beforeend', `
                    <div class="stat-line"><span style="text-transform:capitalize">${ex.replace('ammocan', 'Ammo Can')}</span><span class="stat-total">${total}</span></div>
                `);
            });
        }

        function saveWeight(id, val) { localStorage.setItem(`weight_${id}`, val); }
        function toggleWeekly(id, num) {
            const key = `w_${id}_${num}`;
            localStorage.setItem(key, localStorage.getItem(key) !== 'true');
            updateUI();
        }

        function updateUI() {
            let allDone = true;
            exercises.forEach(ex => {
                const count = parseInt(localStorage.getItem(ex)) || 0;
                const card = document.getElementById(`card-${ex}`);
                const goal = parseInt(card.getAttribute('data-goal'));
                const percent = Math.min((count / goal) * 100, 100);
                card.querySelector('.count-display').innerText = `${count}/${goal}`;
                card.querySelector('.progress-bar-fill').style.width = percent + '%';
                if (count >= goal) {
                    card.querySelector('.complete-status').style.display = 'block';
                    card.querySelector('.input-group').style.display = 'none';
                    card.querySelector('.progress-bar-fill').style.background = 'var(--success)';
                } else {
                    card.querySelector('.complete-status').style.display = 'none';
                    card.querySelector('.input-group').style.display = 'flex';
                    card.querySelector('.progress-bar-fill').style.background = 'var(--primary)';
                    allDone = false;
                }
            });

            weeklyEx.forEach(ex => {
                let doneCount = 0;
                [1, 2].forEach(num => {
                    const btn = document.getElementById(`${ex.id}-${num}`);
                    if (localStorage.getItem(`w_${ex.id}_${num}`) === 'true') { btn.classList.add('done'); doneCount++; } 
                    else { btn.classList.remove('done'); }
                });
                document.getElementById(`w-${ex.id}-c`).style.display = (doneCount === 2) ? 'inline' : 'none';
            });

            if (allDone) localStorage.setItem('dailyComplete', 'true');
            let comms = parseInt(localStorage.getItem('commissions')) || 0;
            document.getElementById('commission-count').innerText = `${comms}/5`;
            document.getElementById('commission-fill').style.width = (comms / 5 * 100) + '%';
            renderStats();
        }

        function addReps(ex, manualVal = null) {
            const input = document.querySelector(`#card-${ex} input`);
            const val = manualVal || parseInt(input.value);
            if (!isNaN(val)) {
                localStorage.setItem(ex, (parseInt(localStorage.getItem(ex)) || 0) + val);
                localStorage.setItem('total_' + ex, (parseInt(localStorage.getItem('total_' + ex)) || 0) + val);
                updateUI();
                if(input) input.value = '';
            }
        }

        function dangerZoneReset() {
            if(confirm("Wipe everything?")) { localStorage.clear(); location.reload(); }
        }

        function showTab(tabId, element) {
            document.querySelectorAll('.tab-content').forEach(tab => tab.classList.remove('active'));
            document.querySelectorAll('.nav-item').forEach(nav => nav.classList.remove('active'));
            document.getElementById(tabId).classList.add('active');
            element.classList.add('active');
        }

        checkResets();
        renderWeekly();
        updateUI();
    </script>
</body>
</html>
