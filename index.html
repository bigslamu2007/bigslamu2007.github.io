<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>My Life App</title>
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <style>
        :root { --primary: #007AFF; --bg: #f2f2f7; --card: #ffffff; --text: #000000; }
        body { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; background: var(--bg); margin: 0; padding: 0; height: 100vh; overflow: hidden; }
        
        .header { padding: 50px 20px 20px; background: var(--bg); font-size: 28px; font-weight: bold; }
        
        .content-area { height: calc(100vh - 160px); overflow-y: auto; padding: 0 20px; }
        
        .tab-content { display: none; animation: fadeIn 0.3s; }
        .tab-content.active { display: block; }
        
        .goal-card { background: var(--card); padding: 15px; border-radius: 12px; margin-bottom: 10px; box-shadow: 0 2px 5px rgba(0,0,0,0.05); }
        
        /* Bottom Nav */
        .nav-bar { position: fixed; bottom: 0; width: 100%; height: 85px; background: rgba(255,255,255,0.8); backdrop-filter: blur(10px); display: flex; justify-content: space-around; padding-top: 10px; border-top: 0.5px solid #d1d1d6; }
        .nav-item { text-align: center; color: #8e8e93; font-size: 10px; flex: 1; }
        .nav-item.active { color: var(--primary); }
        .nav-item i { display: block; font-size: 24px; margin-bottom: 4px; }

        @keyframes fadeIn { from { opacity: 0; } to { opacity: 1; } }
    </style>
</head>
<body>

    <div class="header" id="page-title">Daily Goals</div>

    <div class="content-area">
        <div id="daily" class="tab-content active">
            <div class="goal-card">☀️ Drink 2L Water</div>
            <div class="goal-card">🏃‍♂️ 30 min Walk</div>
        </div>
        <div id="weekly" class="tab-content">
            <div class="goal-card">📚 Read 1 Book</div>
        </div>
        <div id="monthly" class="tab-content">
            <div class="goal-card">💰 Save $500</div>
        </div>
        <div id="yearly" class="tab-content">
            <div class="goal-card">✈️ Visit Japan</div>
        </div>
        <div id="stats" class="tab-content">
            <div class="goal-card"><b>Strength:</b> Level 15</div>
            <div class="goal-card"><b>Focus:</b> Level 22</div>
        </div>
    </div>

    <nav class="nav-bar">
        <div class="nav-item active" onclick="showTab('daily', 'Daily Goals', this)">●<br>Daily</div>
        <div class="nav-item" onclick="showTab('weekly', 'Weekly Goals', this)">●<br>Weekly</div>
        <div class="nav-item" onclick="showTab('monthly', 'Monthly Goals', this)">●<br>Monthly</div>
        <div class="nav-item" onclick="showTab('yearly', 'Yearly Goals', this)">●<br>Yearly</div>
        <div class="nav-item" onclick="showTab('stats', 'Character Stats', this)">●<br>Stats</div>
    </nav>

    <script>
        function showTab(tabId, title, element) {
            // Hide all tabs
            document.querySelectorAll('.tab-content').forEach(tab => tab.classList.remove('active'));
            document.querySelectorAll('.nav-item').forEach(nav => nav.classList.remove('active'));
            
            // Show selected tab
            document.getElementById(tabId).classList.add('active');
            document.getElementById('page-title').innerText = title;
            element.classList.add('active');
        }
    </script>
</body>
</html>
