<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Life OS</title>
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black">
    <style>
        :root { 
            --primary: #0A84FF; 
            --success: #32D74B;
            --bg: #000000; 
            --card: #1C1C1E; 
            --text: #FFFFFF; 
            --secondary-text: #8E8E93;
            --border: #38383A;
        }

        body { 
            font-family: -apple-system, sans-serif; 
            background: var(--bg); 
            color: var(--text);
            margin: 0; 
            padding: 0; 
            height: 100vh; 
            overflow: hidden; 
        }

        /* Top Tab Bar - Distinguished Tabs */
        .nav-bar { 
            position: fixed; 
            top: 0; 
            width: 100%; 
            display: flex; 
            background: #161617;
            padding-top: env(safe-area-inset-top);
            z-index: 1000;
        }

        .nav-item { 
            flex: 1; 
            height: 50px;
            display: flex; 
            align-items: center; 
            justify-content: center; 
            color: var(--secondary-text); 
            font-size: 11px; 
            font-weight: 600;
            text-transform: uppercase;
            border-right: 1px solid var(--border); /* Distinguishes tabs */
            transition: background 0.2s;
        }

        .nav-item:last-child { border-right: none; }

        .nav-item.active { 
            color: var(--text); 
            background: var(--card);
            box-shadow: inset 0 -3px 0 var(--primary);
        }

        /* Content Layout */
        .content-area { 
            margin-top: calc(70px + env(safe-area-inset-top)); 
            height: calc(100vh - 100px); 
            overflow-y: auto; 
            padding: 0 15px; 
        }

        .tab-content { display: none; animation: fadeIn 0.2s ease-out; }
        .tab-content.active { display: block; }

        /* Goal Cards */
        .goal-card { 
            background: var(--card); 
            padding: 20px; 
            border-radius: 14px; 
            margin-bottom: 12px; 
            border: 1px solid #2C2C2E;
        }

        /* Push-Up Tracker Styling */
        .tracker-header { display: flex; justify-content: space-between; margin-bottom: 10px; font-weight: bold; }
        .progress-container { display: flex; align-items: center; gap: 15px; }
        .count-display { font-family: monospace; font-size: 18px; color: var(--primary); min-width: 70px; }
        
        .progress-bar-bg { flex-grow: 1; height: 8px; background: #3A3A3C; border-radius: 4px; overflow: hidden; }
        .progress-bar-fill { height: 100%; background: var(--primary); width: 0%; transition: width 0.4s ease; }
        
        .input-group { margin-top: 15px; display: flex; gap: 10px; }
        input[type="number"] { 
            background: #2C2C2E; border: none; border-radius: 8px; color: white; 
            padding: 10px; width: 60px; text-align: center; font-size: 16px; 
        }
        button { 
            background: var(--primary); color: white; border: none; 
            border-radius: 8px; padding: 10px 20px; font-weight: 600; flex-grow: 1;
        }

        .complete-status { color: var(--success); font-size: 12px; font-weight: bold; display: none; }

        @keyframes fadeIn { from { opacity: 0; } to { opacity: 1; } }
    </style>
</head>
<body>

    <nav class="nav-bar">
        <div class="nav-item active" onclick="showTab('daily', this)">Daily</div>
        <div class="nav-item" onclick="showTab('weekly', this)">Weekly</div>
        <div class="nav-item" onclick="showTab('monthly', this)">Monthly</div>
        <div class="nav-item" onclick="showTab('yearly', this)">Yearly</div>
        <div class="nav-item" onclick="showTab('stats', this)">Stats</div>
    </nav>

    <div class="content-area">
        <div id="daily" class="tab-content active">
            <div class="goal-card">
                <div class="tracker-header">
                    <span>Do 100 Push-Ups</span>
                    <span id="complete-msg" class="complete-status">COMPLETE ✓</span>
                </div>
                
                <div class="progress-container">
                    <div class="count-display" id="pushup-count">0 / 100</div>
                    <div class="progress-bar-bg">
                        <div id="progress-fill" class="progress-bar-fill"></div>
                    </div>
                </div>

                <div class="input-group" id="input-area">
                    <input type="number" id="pushup-input" placeholder="+0" inputmode="numeric">
                    <button onclick="addPushups()">Add Push-Ups</button>
                </div>
            </div>
            
            <div class="goal-card">💧 2L Water Intake</div>
        </div>

        <div id="weekly" class="tab-content"><div class="goal-card">Weekly Goals...</div></div>
        <div id="monthly" class="tab-content"><div class="goal-card">Monthly Goals...</div></div>
        <div id="yearly" class="tab-content"><div class="goal-card">Yearly Goals...</div></div>
        <div id="stats" class="tab-content"><div class="goal-card">Stats...</div></div>
    </div>

    <script>
        let totalPushups = parseInt(localStorage.getItem('pushups')) || 0;

        function updateUI() {
            const goal = 100;
            const percentage = Math.min((totalPushups / goal) * 100, 100);
            
            document.getElementById('pushup-count').innerText = `${totalPushups} / ${goal}`;
            document.getElementById('progress-fill').style.width = percentage + '%';

            if (totalPushups >= goal) {
                document.getElementById('complete-msg').style.display = 'block';
                document.getElementById('input-area').style.display = 'none';
                document.getElementById('progress-fill').style.background = 'var(--success)';
            }
        }

        function addPushups() {
            const input = document.getElementById('pushup-input');
            const val = parseInt(input.value);
            if (!isNaN(val)) {
                totalPushups += val;
                localStorage.setItem('pushups', totalPushups);
                updateUI();
                input.value = '';
            }
        }

        function showTab(tabId, element) {
            document.querySelectorAll('.tab-content').forEach(tab => tab.classList.remove('active'));
            document.querySelectorAll('.nav-item').forEach(nav => nav.classList.remove('active'));
            document.getElementById(tabId).classList.add('active');
            element.classList.add('active');
        }

        // Initialize display on load
        updateUI();
    </script>
</body>
</html>
